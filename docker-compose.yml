services:
  postgres:
    image: postgres:16
    container_name: laboratorio1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laboratorio1
      POSTGRES_USER: laboratorio1_app
      POSTGRES_PASSWORD: Laboratorio1Local_2026!
    ports:
      - "5432:5432"
    volumes:
      - laboratorio1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratorio1_app -d laboratorio1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  laboratorio1_postgres_data:
